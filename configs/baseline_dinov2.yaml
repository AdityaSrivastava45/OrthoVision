# OrthoVision Stage 3 - DINOv2-S Baseline Configuration

# Experiment metadata
experiment:
  name: "dinov2_baseline"
  description: "Frozen DINOv2-S + mean pooling + linear head for 12-label knee MRI classification"

# Model configuration
model:
  dinov2:
    variant: "dinov2_vits14"          # DINOv2 variant
    pretrained_path: null             # Path to local pretrained weights (null = random init)
    freeze_backbone: true             # Freeze backbone (Mode A)
    unfreeze_last_n_blocks: 0         # Number of last blocks to unfreeze (0 = all frozen)
    img_size: 224                     # Input resolution
    patch_size: 14                    # Patch size
    in_chans: 3                       # Input channels (3 for 2.5D MRI)
    embed_dim: 384                    # Embedding dimension (ViT-Small)
    depth: 12                         # Number of transformer blocks
    num_heads: 6                      # Number of attention heads
    mlp_ratio: 4.0                    # MLP ratio
    qkv_bias: true                    # QKV bias
    drop_path_rate: 0.0               # Drop path rate

  # Pooling configuration
  pooling_type: "mean"                # Pooling type: "mean" | "attention"
  pooling_kwargs: {}                  # Additional kwargs for pooling

  # Classifier configuration
  num_labels: 12                      # Number of output labels
  classifier_dropout: 0.0             # Dropout before classifier

# Training configuration
training:
  # Optimization
  learning_rate: 1e-4                 # Learning rate for classifier head
  weight_decay: 1e-4                  # Weight decay
  optimizer: "AdamW"                  # Optimizer
  epochs: 20                          # Number of epochs
  batch_size: 4                       # Batch size per GPU
  grad_accum_steps: 1                 # Gradient accumulation steps

  # Mixed precision
  use_amp: true                       # Automatic mixed precision

  # Scheduler
  scheduler: "cosine"                 # "cosine" | "constant" | "reduce_on_plateau"
  warmup_epochs: 2                    # Warmup epochs for cosine scheduler

  # Checkpointing
  checkpoint_dir: "experiments/checkpoints"
  save_best: true                     # Save best model based on val macro AUC
  save_last: true                     # Save last checkpoint periodically

  # Logging
  log_interval: 10                    # Log every N batches
  eval_interval: 1                    # Evaluate every N epochs

  # Early stopping
  early_stopping_patience: 10         # Patience for early stopping
  early_stopping_min_delta: 1e-4      # Minimum improvement for early stopping

  # Reproducibility
  deterministic: false                # Full deterministic mode (slower)
  seed: 42                            # Random seed

# Loss configuration
loss:
  weight_method: "balanced"           # Class weight method: "balanced" | "effective_num"
  min_weight: 0.1                     # Minimum class weight
  max_weight: 10.0                    # Maximum class weight

# Data split configuration
split:
  train_ratio: 0.8                    # Training split ratio
  val_ratio: 0.2                      # Validation split ratio
  seed: 42                            # Split random seed
  patient_aware: true                 # Group by PatientID if available
  output_dir: "splits"                # Directory to save split files

# Data loading
dataloader:
  num_workers: 4                      # DataLoader workers
  pin_memory: true                    # Pin memory for faster GPU transfer
  persistent_workers: true            # Keep workers alive between epochs

# Preprocessing configuration (from Stage 2)
preprocessing:
  config_path: "configs/preprocessing.yaml"

# Output directories
output:
  experiments_dir: "experiments"
  predictions_dir: "experiments/predictions"
  logs_dir: "experiments/logs"